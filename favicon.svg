<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Robin Bril">
  <defs>
    <linearGradient id="rb-bg-light" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#dcfce7"/>
      <stop offset="100%" stop-color="#86efac"/>
    </linearGradient>
    <linearGradient id="rb-bg-dark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <style>
      .rb-bg-light { display: block; }
      .rb-bg-dark { display: none; }
      .rb-text { fill: #047857; }
      @media (prefers-color-scheme: dark) {
        .rb-bg-light { display: none; }
        .rb-bg-dark { display: block; }
        .rb-text { fill: #00ff9d; }
      }
    </style>
  </defs>
  <rect class="rb-bg-light" width="64" height="64" rx="14" ry="14" fill="url(#rb-bg-light)"/>
  <rect class="rb-bg-dark" width="64" height="64" rx="14" ry="14" fill="url(#rb-bg-dark)"/>
  <text class="rb-text" x="32" y="34"
        text-anchor="middle" dominant-baseline="central"
        font-family="Georgia, 'Times New Roman', serif"
        font-style="italic" font-weight="700" font-size="36"
        letter-spacing="-1.5">rb</text>
</svg>
